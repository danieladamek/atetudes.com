baseURL: "https://atetudes.com/"
locale: "en-us"
title: "At-Etudes"
enableRobotsTXT: true

module:
  imports:
    - path: "github.com/imfing/hextra"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: "At-Etudes"
      pageRef: "/studies"
      weight: 1
    - name: "Blog"
      pageRef: "/blog"
      weight: 2
    - name: "Search"
      weight: 3
      params:
        type: "search"

cascade:
  params:
    images: ["/assets/og.png"]

params:
  description: "Interactive jazz études for guitar and keyboard — modes, voicings, and voice leading in every key. See it, flip it, hear it."
  theme:
    default: "light"
    displayToggle: false
  navbar:
    displayTitle: false
    displayLogo: true
    logo:
      path: "assets/logo.svg"
      width: 118
  page:
    width: "normal"
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
  editURL:
    enable: false
