baseURL: "https://atetudes.com/"
locale: "en-us"
title: "At-Etudes"
enableRobotsTXT: true

module:
  imports:
    - path: "github.com/imfing/hextra"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: "Studies"
      pageRef: "/studies"
      weight: 1
    - name: "Blog"
      pageRef: "/blog"
      weight: 2
    - name: "Search"
      weight: 3
      params:
        type: "search"

params:
  description: "Programmatically generated, interactive jazz study materials."
  theme:
    default: "light"
    displayToggle: false
  navbar:
    displayTitle: true
    displayLogo: true
    logo:
      path: "assets/favicon.svg"
      width: 22
  page:
    width: "normal"
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: false
  editURL:
    enable: false
