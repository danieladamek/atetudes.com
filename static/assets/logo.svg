  <text x="186" y="138" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="118" font-weight="700" letter-spacing="3">
    <tspan fill="#3C8B2F">e</tspan><tspan fill="#2959A6">t</tspan><tspan fill="#A9ABB4">u</tspan><tspan fill="#212126">d</tspan><tspan fill="#1CB8D1">e</tspan><tspan fill="#D99A08">s</tspan>
  </text>
</svg>
