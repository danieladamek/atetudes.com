# Build the Hugo/Hextra site and deploy to GitHub Pages.
# Adapted from Hextra's recommended workflow.

name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: "0.164.0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Engine tests
        # node:test, zero dependencies — includes the characterization suite that
        # pins the shipped Triadetudes engine. A red test blocks deploy.
        run: node --test engine/tests/*.test.mjs
      - name: Door build gate
        # family spec §4.2.2: the style-ownership rule, the static-derivation
        # bans, and the artifact greps — the half of the door gate that needs no
        # browser and no dependencies.
        run: node --test hub/tests/*.test.mjs
      - uses: actions/setup-python@v5
        # a runner-managed Python, so `pip install` below is not fighting
        # ubuntu's externally-managed system interpreter. check_site.py is
        # stdlib-only and does not care which of the two it gets.
        with:
          python-version: "3.12"
      - name: Door lock suite (browser)
        # family spec §4.2.2's AUTHORITATIVE half, local-only for two sessions
        # and now guarding the branch that deploys: the rendered control
        # partition (§4.2.1's equality over the control universe), the
        # orphan-selector check, and file:// with the network aborted.
        #
        # Playwright is a CI devDependency, approved by Daniel 2026-08-16. It is
        # a build-time tool and ships in nothing, so charter §5's single-file
        # offline promise is untouched. Pinned to the version the gate was
        # developed against, so a browser bump is a deliberate act with a log
        # entry rather than a silent change in what "green" means.
        run: |
          pip install playwright==1.55.0
          playwright install --with-deps chromium
          node hub/tools/build.mjs
          python3 hub/tests/door_locks.py
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - name: Setup Hugo
        run: |
          wget -O ${{ runner.temp }}/hugo.deb \
            https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb
          sudo dpkg -i ${{ runner.temp }}/hugo.deb
      - uses: actions/configure-pages@v5
        id: pages
      - name: Build
        run: hugo --gc --minify
      - name: Check site integrity
        env:
          GH_TOKEN: ${{ github.token }}   # tools/deploy_record.py verify re-fetches every recorded run (260921)
        run: python3 tools/check_site.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
